<h1>계정 삭제 안내</h1>
<p>모디 계정을 삭제하면 섹션, 할 일, 아이디어가 모두 즉시 영구 삭제되며 복구할 수 없습니다.</p>
<h2>앱에서 삭제하기</h2>
<ul>
  <li><strong>휴대폰:</strong> 할 일 화면 오른쪽 위 계정 아이콘 → 계정 삭제 → 확인</li>
  <li><strong>PC:</strong> 창의 계정 아이콘 또는 트레이 아이콘 오른쪽 클릭 → 계정 → 계정 삭제 → 확인</li>
</ul>
<h2>앱을 쓸 수 없을 때</h2>
<p>가입한 이메일 주소로 <a href="mailto:ssingssingii1220@gmail.com?subject=%EB%AA%A8%EB%94%94%20%EA%B3%84%EC%A0%95%20%EC%82%AD%EC%A0%9C%20%EC%9A%94%EC%B2%AD">ssingssingii1220@gmail.com</a>에 "모디 계정 삭제 요청"이라고 보내 주세요. 본인 확인 후 <strong>7일 안에</strong> 삭제하고 결과를 회신합니다.</p>
